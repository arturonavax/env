# ==============================================================================
# ~/.config/kitty/kitty.conf — arturonavax/env Kitty Configuration
# ==============================================================================

# Tokyo Night Color Scheme
foreground            #c0caf5
background            #1a1b26
selection_foreground  #none
selection_background  #283457

# Colors
color0  #15161e
color8  #414868
color1  #f7768e
color9  #f7768e
color2  #9ece6a
color10 #9ece6a
color3  #e0af68
color11 #e0af68
color4  #7aa2f7
color12 #7aa2f7
color5  #bb9af7
color13 #bb9af7
color6  #7dcfff
color14 #7dcfff
color7  #a9b1d6
color15 #c0caf5

# Font & Typography
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Performance & Multiplexing
enable_audio_bell no
scrollback_lines  10000
cursor_shape      block

# Default shell / launcher
shell zsh -ic "herdr"
