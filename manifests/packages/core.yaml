# Declarative Core System & Build Packages Manifest
# Add or customize multi-distro / multi-OS package mappings here without modifying Go source code.
packages:
  - id: anx
    name: ANX Environment Engine
    category: core
    description: Autonomous dotfile engine, package orchestrator, and multi-tool workspace manager
    binary_name: anx
    binary_aliases:
      - aitools
      - safe-suspend
    strategies:
      - type: script
        when:
          os: [linux, darwin]
        script:
          url: https://raw.githubusercontent.com/arturonavax/env/main/install.sh
          interpreter: sh
          creates: "~/.local/bin/anx"

  - id: build-essential
    name: Build Essential Toolchain
    category: core-build
    description: C/C++ compiler suite, make, and standard system headers
    os: [linux]
    strategies:
      - type: native
        packages:
          apt: [build-essential]
          dnf: ["@development-tools"]
          pacman: [base-devel]
          zypper: [devel_basis]
          apk: [build-base]
          pkg: [build-essential]

  - id: git
    name: Git
    category: core
    description: Distributed version control system
    binary_name: git
    strategies:
      - type: native
        packages:
          apt: [git]
          dnf: [git]
          pacman: [git]
          zypper: [git]
          apk: [git]
          brew: [git]
          pkg: [git]
          winget: [Git.Git]
          scoop: [git]

