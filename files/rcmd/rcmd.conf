# ==============================================================================
# rcmd configuration file
# ==============================================================================
# Format: KEY | LAUNCH_COMMAND | [WINDOW_PATTERN]
#
# - KEY: Single letter (a-z) or key identifier (case-insensitive).
# - LAUNCH_COMMAND: Command to launch if the application is not running.
# - WINDOW_PATTERN: Substring or regex to match the window class or title.
#                   (If omitted, defaults to LAUNCH_COMMAND).
#
# DYNAMIC FALLBACK:
# If you press a key that is NOT defined below, rcmd will automatically look
# for any open window whose class, process name, or title starts with that
# letter (matching macOS rcmd behavior).
# ==============================================================================

# Terminal & Editors
t | ghostty | ghostty
e | cursor | cursor

# Browsers
b | firefox | firefox
f | firefox | firefox
c | chromium | chromium

# Productivity & Media
a | anki | anki
s | spotify | spotify
# g | telegram-desktop | telegram  # (Uncomment if you want 'g' fixed to Telegram instead of dynamic Ghostty)
