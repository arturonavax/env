name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.26', '1.27']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run unit & integration tests (Unix)
        if: runner.os != 'Windows'
        run: go test -v -race -timeout 10m ./...

      - name: Run unit & integration tests (Windows)
        if: runner.os == 'Windows'
        run: go test -v -timeout 10m ./...

      - name: Build ANX binary
        run: go build -v -ldflags "-X main.Version=ci -X main.Commit=${{ github.sha }} -X main.Date=$(date -u +%Y-%m-%d 2>/dev/null || echo ci)" -o bin/ ./cmd/anx

  lint:
    name: Shell & Code Linting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Shell scripts syntax
        run: |
          bash -n scripts/*.sh install.sh uninstall.sh
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck scripts/bootstrap_anx.sh install.sh uninstall.sh
          fi
