# --- Terminal & Colores (Ghostty & Neovim) ---
set -s default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:usstyle:focus"

# Undercurl y estilos modernos (terminfo nativo)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Passthrough de secuencias de escape (Kitty Graphics para Snacks.image)
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# --- Rendimiento y Tiempos ---
set -g repeat-time 300
set -s escape-time 10
set -g status-interval 5
set -g history-limit 100000
set -g focus-events on
set -g @is_focused 1
set-hook -g client-focus-in 'set -g @is_focused 1'
set-hook -g client-focus-out 'set -g @is_focused 0'
# Desactiva monitoreo de actividad en segundo plano
setw -g monitor-activity off
set -g visual-activity off

# Sincronización nativa de portapapeles OSC 52
set -s set-clipboard on

# Ventanas y modo Vi
setw -g mode-keys vi
set -g mouse on
setw -g aggressive-resize off

# --- Atajos de teclado ---
# Prefix Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- Copiado nativo con mouse y teclado (OSC 52 a Ghostty) ---
# Copiar al soltar el mouse sin cancelar la selección ni saltar al final
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-no-clear

# Copiar con 'y' sin salir de copy-mode ni saltar al final
bind-key -T copy-mode-vi y send-keys -X copy-selection-no-clear

# Iniciar selección con 'v'
bind-key -T copy-mode-vi v send-keys -X begin-selection
# Recargar configuración
bind r source-file ~/.tmux.conf \; display-message "~/.tmux.conf recargado!"

# 1 línea estricta por tick de mouse
bind-key -T copy-mode-vi WheelUpPane   send-keys -X -N 2 scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X -N 2 scroll-down
bind-key -T copy-mode    WheelUpPane   send-keys -X -N 2 scroll-up
bind-key -T copy-mode    WheelDownPane send-keys -X -N 2 scroll-down

# Navegación entre paneles
bind h select-pane -L
bind l select-pane -R
bind k select-pane -U
bind j select-pane -D

# Navegación entre ventanas
bind -r C-p select-window -t :-
bind -r C-n select-window -t :+

# Redimensión de paneles
bind -r < resize-pane -L 10
bind -r + resize-pane -D 5
bind -r - resize-pane -U 5
bind -r > resize-pane -R 10

# Instalación automática de TPM
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# --- Plugins (TPM) ---
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'arturonavax/tmux-theme'
set -g @plugin 'tmux-plugins/tmux-battery'
# set -g @plugin 'tmux-plugins/tmux-open'
set -g @open 'x'

# Configuración de batería
set -g @batt_icon_status_discharging '👇'
set -g @batt_icon_status_charging '👆'
set -g @batt_icon_status_charged '👌'
set -g @batt_icon_status_attached '🏠'
set -g @batt_icon_status_unknown '❓'
set -g @my_widgets "#{battery_icon_status} #{battery_percentage}"

# Ejecutar plugins
run '~/.tmux/plugins/tpm/tpm'

# --- Estilos de mensaje y selección ---
%hidden color_primary="#BF4B4B"
%hidden color_fg_dark="#16161E"

set -wg mode-style "bg=#{color_primary},fg=#{color_fg_dark}"
set -wg message-style "bg=#{color_primary},fg=#{color_fg_dark}"
