name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.27.3']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run unit & integration tests (Unix)
        if: runner.os != 'Windows'
        run: go test -v -race -timeout 10m ./...

      - name: Run unit & integration tests (Windows)
        if: runner.os == 'Windows'
        run: go test -v -timeout 10m ./...

      - name: Build ANX binary (Unix)
        if: runner.os != 'Windows'
        run: go build -v -ldflags "-X main.Version=ci -X main.Commit=${{ github.sha }} -X main.Date=$(date -u +%Y-%m-%d)" -o bin/ ./cmd/anx

      - name: Build ANX binary (Windows)
        if: runner.os == 'Windows'
        run: go build -v -ldflags "-X main.Version=ci -X main.Commit=${{ github.sha }} -X main.Date=ci" -o bin\anx.exe .\cmd\anx

  lint:
    name: Shell & Code Linting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 26 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Check Shell scripts syntax
        run: |
          bash -n scripts/*.sh install.sh uninstall.sh files/security/anx-security
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck scripts/bootstrap_anx.sh install.sh uninstall.sh files/security/anx-security
          fi

  e2e:
    name: E2E Integration (Docker)
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true

      - name: Set up Node 26 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Run Docker E2E Suite (Debian & Alpine)
        run: |
          docker compose -f tests/e2e/docker-compose.yml build
          docker compose -f tests/e2e/docker-compose.yml up -d mock-server
          docker compose -f tests/e2e/docker-compose.yml run -T --rm test-debian
          docker compose -f tests/e2e/docker-compose.yml run -T --rm test-alpine
          docker compose -f tests/e2e/docker-compose.yml down -v
