# Declarative Hardware & Workstation System Hacks
# Machine- and hardware-specific optimizations with DMI and hardware auto-detection.
# Hacks are safe-by-default and only applied when opt-in or matching hardware is confirmed.
hacks:
  - id: dell-precision-m6800
    name: "Dell Precision M6800 Workstation Suite (Quadro K3100M / Nouveau / Xfce)"
    category: workstation
    description: >-
      Resolves Ghostty GTK AT-SPI input latency and DRI3 buffer leaks, Mesa Nouveau
      Picom GLX fence stability, Brave Skia/2D canvas GPU lockups, dual-monitor Xfce
      top-panel strut alignment, instant RandR Night Shift toggling, and unwanted
      04:00 AM RTC suspend wakeups on Dell Precision M6800 workstations.
    safe_by_opt_in: true
    match:
      os:
        - linux
      dmi_vendor: Dell
      dmi_product: Precision M6800
      gpu_driver: nouveau
      desktop_env:
        - xfce
    backup_paths:
      - "~/.config/ghostty/config"
      - "~/.config/picom/picom.conf"
      - "~/.config/BraveSoftware"
      - "~/.config/brave-flags.conf"
      - "~/.config/night-shift.conf"
    config_diffs:
      - config_id: ghostty-config
        set_keys:
          background-opacity: "1.0"
          window-vsync: "false"
    steps:
      - id: apply-m6800-workstation-hacks
        name: Apply Dell Precision M6800 Nouveau & Xfce Optimizations
        description: >-
          Configures Ghostty wrapper and bounded scrollback, Picom GLX DRI3 fences,
          Brave X11 Nouveau flags, Xfce Y=0 monitor alignment, instant RandR Night
          Shift session guard, and disables 04:00 AM RTC wakeups.
        script: manifests/hacks/dell-precision-m6800/apply_hacks.sh
        touches:
          - "~/.config/ghostty/config"
          - "~/.local/bin/ghostty"
          - "~/.config/picom/picom.conf"
          - "~/.config/brave-flags.conf"
          - "~/.config/night-shift.conf"
          - "~/.local/bin/toggle-redshift"
          - "~/.local/bin/xfce-session-guard"
          - "~/.config/systemd/user/xfce-session-guard.service"
        privileged: false

  - id: dell-xps13-9343
    name: "Dell XPS 13 9343 Broadcom BCM4352 Wi-Fi Driver Suite"
    category: hardware-network
    description: >-
      Ensures installation, DKMS module compilation, and kernel binding of the
      proprietary Broadcom STA wireless driver (broadcom-sta-dkms / wl) for the
      Dell Wireless 1560 (BCM4352 802.11ac [14e4:43b1]) adapter on Dell XPS 13 9343.
    safe_by_opt_in: true
    match:
      os:
        - linux
      dmi_vendor: Dell
      dmi_product: XPS 13 9343
    backup_paths: []
    steps:
      - id: apply-xps13-wifi-driver
        name: Ensure broadcom-sta-dkms and wl module are active
        description: >-
          Installs broadcom-sta-dkms and dkms if missing, unloads conflicting bcma,
          loads the wl kernel module, and restarts NetworkManager to bind wireless interfaces.
        script: manifests/hacks/dell-xps13-9343/apply_wifi_hack.sh
        touches: []
        privileged: true

  - id: x11-scroll-lock-led
    name: "X11 Scroll Lock Keyboard Backlight LED Toggle"
    category: hardware-input
    description: >-
      Toggles the X11 Scroll Lock hardware LED indicator for external keyboards
      whose backlight illumination is controlled by the Scroll Lock state.
    safe_by_opt_in: true
    match:
      os:
        - linux
      display_server:
        - x11
    backup_paths: []
    steps:
      - id: toggle-scroll-lock-led
        name: Enable X11 Scroll Lock LED
        description: Queries the X11 keyboard LED state via xset and ensures Scroll Lock is active.
        script: manifests/hacks/x11-scroll-lock-led/activate_scroll_lock.sh
        args: ["--on"]
        privileged: false
