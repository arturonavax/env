# Atuin configuration (~/.config/atuin/config.toml)
# https://docs.atuin.sh/configuration/config/

# Modo de búsqueda fuzzy ultra rápido
search_mode = "fuzzy"

# Filtrar por defecto de forma global para no ocultar comandos de otros directorios al entrar a la terminal
filter_mode = "global"

# Filtrar por directorio al usar la tecla flecha arriba (Up Arrow)
filter_mode_shell_up_key_binding = "directory"

# Desactivar sincronización remota (100% local y offline)
auto_sync = false
update_check = false

# Estilo de interfaz compacto
style = "compact"
inline_height = 15

# Teclas de atajo y navegación rápida
enter_accept = true
show_preview = true
