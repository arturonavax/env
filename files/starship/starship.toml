"$schema" = 'https://starship.rs/config-schema.json'

command_timeout = 1000
add_newline = true

# Layout de dos líneas limpio
format = """
$directory\
$git_branch\
$git_status\
$git_state\
$golang\
$rust\
$python\
$docker_context\
$cmd_duration\
$custom\
$line_break\
$character"""

# Línea de entrada simple (rojo si el comando anterior falló)
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"

[git_branch]
symbol = "󰘬 "
style = "bold purple"

[git_status]
style = "bold red"
format = '([\[$all_status$ahead_behind\]]($style) )'

[golang]
symbol = " "
format = "[$symbol($version )]($style)"
style = "bold blue"

[rust]
symbol = "󱘗 "
format = "[$symbol($version )]($style)"
style = "bold red"

[python]
symbol = " "
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
style = "yellow"

[cmd_duration]
min_time = 2_000
format = "took [$duration]($style) "
style = "bold yellow"

[docker_context]
format = "via [$symbol$context]($style) "
symbol = " "
only_with_files = true

# Desactivar módulos lentos o ruidosos por defecto
[package]
disabled = true

[aws]
disabled = true

[gcloud]
disabled = true

[custom.agent_workspace]
description = "Alerta si el repo actual tiene directivas de contexto para agentes de IA"
command = "echo 'AGENTS'"
when = "test -f AGENTS.md || test -d .agents"
format = "via [🤖 $output]($style) "
style = "bold cyan"
