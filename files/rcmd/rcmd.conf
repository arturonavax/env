# ==============================================================================
# rcmd configuration file
# ==============================================================================
# Format: KEY | LAUNCH_COMMAND | [WINDOW_PATTERN] | [MATCH_MODE]
#
# - KEY: Single letter (a-z) or key identifier (case-insensitive).
# - LAUNCH_COMMAND: Command to launch if the application is not running.
# - WINDOW_PATTERN: Substring or regex to match the window.
#                   (If omitted, defaults to LAUNCH_COMMAND).
# - MATCH_MODE: 'class' (default) to match WM_CLASS / app_id,
#               or 'title' to search by window title (e.g. for web apps).
#
# DYNAMIC FALLBACK:
# If you press a key that is NOT defined below, rcmd will automatically look
# for any open window whose class, process name, or title starts with that
# letter (matching macOS rcmd behavior).
# ==============================================================================

# Terminal & Editors
t | ghostty | ghostty | class
e | cursor | cursor | class

# Browsers
b | firefox | firefox | class
f | firefox | firefox | class
c | chromium | chromium | class

# Dedicated Web Apps / Windows (Matched by Title)
# Matches any window whose title contains "WhatsApp" (handles notification prefixes like "(1) WhatsApp")
w | firefox --new-window https://web.whatsapp.com | WhatsApp | title
# Alternative for Chromium / Brave:
# w | chromium --app=https://web.whatsapp.com | WhatsApp | title

# Productivity & Media
a | anki | anki | class
s | spotify | spotify | class
# g | telegram-desktop | telegram | class  # (Uncomment if you want 'g' fixed to Telegram instead of dynamic Ghostty)
